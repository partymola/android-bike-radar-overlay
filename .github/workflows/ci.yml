name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fast JVM tests - runs on every push and PR. Lint and ktlint live in the
  # separate static-analysis job below so they run concurrently with this one
  # instead of serializing inside a single Gradle invocation.
  unit-tests:
    name: JVM unit tests (Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Diff-coverage gate diffs against the base ref (PR base SHA, or the
          # push's previous main tip); full history makes that ref reachable.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      # Robolectric downloads its android-all-instrumented SDK jars (~100 MB
      # per API level) into ~/.m2 the first time a test runs on each level.
      # setup-gradle persists the Gradle user home but NOT ~/.m2, so without
      # this they re-download on every run. Keyed on the test build config so a
      # Robolectric-version or targetSdk bump invalidates the cache.
      - name: Cache Robolectric SDK jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-m2-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-m2-${{ runner.os }}-

      - name: Run unit tests, screenshots, and coverage gate
        # jacocoCoverageVerification fails if testable-logic coverage drops
        # below the ratchet floor. verifyRoborazziDebug renders the Compose and
        # Canvas screenshot goldens via Robolectric Native Graphics and fails on
        # pixel drift - it runs in cold-cache CI, which Paparazzi's layoutlib
        # loader could not.
        run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug :app:jacocoCoverageVerification :app:jacocoTestReport :app:jacocoDiffReport --console=plain --no-daemon

      # Diff-coverage gate: new/changed executable production lines must clear
      # the floor, so an untested feature can't land while the project average
      # holds (the fixed jacocoCoverageVerification floor can't catch that).
      # Scope is jacocoDiffReport, which keeps Compose UI IN: per-diff there is
      # nothing to dilute, so derivation written inline in a Composable body is
      # gated rather than exempt. (The ratchet keeps the narrower report - see
      # app/build.gradle.kts for why the two must not share one exclusion
      # list.) A PR is gated against its base; a push against the prior main
      # tip; a tiny or unreachable-base diff passes (see the script header).
      - name: Diff-coverage gate
        run: |
          python3 -m pip install --quiet --break-system-packages diff-cover==10.3.0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          python3 scripts/diff-coverage-gate.py --base "$BASE" --fail-under 85 --min-lines 10

  # Lint + ktlint - split into its own job so it runs concurrently with the
  # test job instead of serializing behind it in one Gradle invocation.
  # lintDebug fails on any lint error; ktlintCheck fails on any violation
  # outside app/config/ktlint/baseline.xml. Neither runs Robolectric, so this
  # job needs no SDK-jar cache and only a shallow checkout.
  static-analysis:
    name: Lint and ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Run lint and ktlint
        run: ./gradlew :app:lintDebug :app:ktlintCheck --console=plain --no-daemon

      # Non-blocking on purpose. The goldens re-record on any UI change, so
      # failing the build here would turn every UI pull request red until the
      # README and store copies were refreshed in the same commit, and a check
      # that fires on routine work gets bypassed. It runs on every push so the
      # drift is visible in the log the day it appears: the store listing
      # advertised an encryption layer the app does not have for months,
      # because nothing ran.
      - name: Screenshot freshness (report only)
        continue-on-error: true
        run: python3 scripts/check-screenshot-freshness.py

      # Findings here are non-blocking, for a different reason to the step
      # above: this one reaches the network to read each artifact's POM, so a
      # CDN blip would red a build that has nothing wrong with it, and a check
      # that cries wolf gets bypassed. It is a watch on dependency bumps, not a
      # release gate.
      #
      # To promote once it has been quiet for a few months: add --strict AND
      # delete the whole `set +e` ... `exit 0` wrapper, leaving the bare
      # invocation. Adding --strict on its own does nothing, because its only
      # signal is exit 1 and the wrapper swallows exactly that. Deleting only
      # the `if` line is worse than doing nothing: `exit 0` then swallows the
      # abort as well.
      #
      # The wrapper is why the promotion is a two-part edit rather than a flag:
      # it also isolates a crash in the script, which would exit 1 and red a
      # step that is meant to be advisory.
      #
      # The step is NOT continue-on-error, because that discards every exit
      # code including the abort. Findings are swallowed explicitly below and
      # exit 2 - "the check examined nothing" - is left fatal, since that must
      # never read as "found nothing". The Gradle step and the self-test are
      # fatal for the same reason: without either, the real check cannot run.
      - name: Transitive licences (report only)
        run: |
          ./gradlew :app:writeReleaseRuntimeCoordinates --console=plain --no-daemon
          python3 scripts/check-transitive-licences.py --self-test
          set +e
          python3 scripts/check-transitive-licences.py \
            --coordinates app/build/reports/licences/release-runtime-coordinates.txt
          code=$?
          set -e
          if [ "$code" = 2 ]; then exit 2; fi
          exit 0

  # The release variant's only coverage. Every other job here builds debug,
  # which R8 never touches, so without this the first thing that can fail on a
  # shrunk APK is the tag build - and by then the tag is public and the only
  # way out is a dead tag and a re-cut.
  #
  # No secrets needed: the release signingConfig falls back to debug signing
  # when the keystore env vars are absent, which is the case here. This job
  # proves the shrunk APK still carries the names it persists, not that the
  # signed artefact is publishable.
  #
  # Unlike boot-smoke below, this DOES run on PRs, despite costing a full R8
  # and resource-shrink build each iteration. A PR editing proguard-rules.pro
  # is the case it most guards, and finding that out after the merge means
  # finding it out at tag time.
  release-shrink:
    name: Release shrink gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Build the shrunk APK and check its kept names
        run: ./gradlew :app:assembleRelease :app:verifyReleaseDexKeeps --console=plain --no-daemon

  # Real-APK boot smoke - runs only on pushes to main (not PRs) to avoid
  # spending 5+ minutes on an emulator for every PR iteration. It runs
  # concurrently with unit-tests rather than after it: parallelism wins ~3 min
  # of wall-clock on the common green push, at the cost of occasionally booting
  # an emulator for a push whose unit tests then fail (pushes to main are
  # almost always green, so that trade favours wall-clock).
  #
  # What this catches that the JVM suite cannot: missing manifest entries,
  # AndroidKeyStore first-use failures, permission requests that throw at
  # startup, immediate crashes in Application or Activity onCreate that only
  # surface on a real Dalvik/ART VM.
  #
  # What this does NOT cover: BLE (scanner is null on the stock emulator),
  # the SYSTEM_ALERT_WINDOW overlay (permission not granted automatically),
  # or any logic tested by the Robolectric suite. Nor R8 stripping - it
  # installs app-debug.apk, which R8 never processes. release-shrink above
  # is what covers that.
  boot-smoke:
    name: APK boot smoke (API 34 emulator)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK and verify boot on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          # AOSP (default) target boots faster than google_apis and has no
          # Play Services dependency - sufficient for a boot-alive check.
          target: default
          # reactivecircus/android-emulator-runner runs each line of `script`
          # in its own `sh -c` invocation, so multi-line `if/then/fi` doesn't
          # survive. Each step has to stand alone or chain with `&&` / `;`.
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n es.jjrh.bikeradar/.MainActivity
            for i in $(seq 1 15); do pid=$(adb shell pidof es.jjrh.bikeradar || true); [ -n "$pid" ] && break; sleep 1; done; if [ -z "$pid" ]; then echo "::error::App process not alive 15 s after launch - likely a boot crash"; adb logcat -d -s AndroidRuntime:E BikeRadar:E | tail -30; exit 1; fi; echo "OK: app alive at PID $pid"
