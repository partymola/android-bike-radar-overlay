name: Keyword scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: the scan only reads commits + the diff, never writes.
permissions:
  contents: read

jobs:
  scan:
    name: Commit message + diff keyword scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          else
            # First push of a branch — scan back to the initial commit.
            echo "base=$(git rev-list --max-parents=0 HEAD | tail -1)" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan commit messages
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          SCAN_REGEX: ${{ secrets.KEYWORD_SCAN_PATTERN }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$SCAN_REGEX" ]; then
            if [ "$FORK_PR" = "true" ]; then
              # Fork PRs don't receive repository secrets; the same commits
              # are re-scanned by the push run when they land on main.
              echo "::notice::Scan pattern unavailable on fork PRs - skipping; the push to main re-runs this scan."
              exit 0
            fi
            echo "::error::KEYWORD_SCAN_PATTERN secret is not set"
            exit 1
          fi
          hits=$(git log --format='%H%n%B%n---%n' "$BASE..$HEAD" 2>/dev/null | grep -nEi "$SCAN_REGEX" || true)
          if [ -n "$hits" ]; then
            # Count only. GitHub masks the PATTERN because it is a secret, but
            # it does not mask the matched TEXT, so printing hits publishes the
            # very string the scan exists to keep out of a public log.
            echo "::error::Dangerous keywords in commit message(s) in push range: $(printf '%s\n' "$hits" | wc -l) match(es). Re-run the scan locally to see them."
            exit 1
          fi

      - name: Scan added lines
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          SCAN_REGEX: ${{ secrets.KEYWORD_SCAN_PATTERN }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$SCAN_REGEX" ]; then
            if [ "$FORK_PR" = "true" ]; then
              echo "::notice::Scan pattern unavailable on fork PRs - skipping; the push to main re-runs this scan."
              exit 0
            fi
            echo "::error::KEYWORD_SCAN_PATTERN secret is not set"
            exit 1
          fi
          hits=$(git log -p "$BASE..$HEAD" 2>/dev/null \
            | awk '/^\+\+\+/{next} /^\+/{print}' \
            | grep -nEi "$SCAN_REGEX" || true)
          if [ -n "$hits" ]; then
            # Count only - see the note above; the matched diff line must not
            # reach a public Actions log.
            echo "::error::Dangerous keywords in newly-added lines in push range: $(printf '%s\n' "$hits" | wc -l) match(es). Re-run the scan locally to see them."
            exit 1
          fi
