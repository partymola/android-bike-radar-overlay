name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  scan:
    name: Keyword scan on tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan tag commit message
        env:
          SCAN_REGEX: ${{ secrets.RELEASE_SCAN_PATTERN }}
        run: |
          if [ -z "$SCAN_REGEX" ]; then
            echo "::error::RELEASE_SCAN_PATTERN secret is not set"
            exit 1
          fi
          hits=$(git log -1 --format='%B' HEAD | grep -nEi "$SCAN_REGEX" || true)
          if [ -n "$hits" ]; then
            echo "::error::Dangerous keywords in the tag's commit message"
            printf '%s\n' "$hits"
            exit 1
          fi

  build:
    name: Build + publish signed APK
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92  # v6.2.0
        with:
          # Pinned to the minimum Gradle required by AGP 9.2 per
          # https://developer.android.com/build/releases/gradle-plugin .
          # Bump in lockstep with any AGP upgrade.
          gradle-version: '9.6.1'

      - name: Decode release keystore into runner temp
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --console=plain --no-daemon

      - name: Rename APK with tag
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "bike-radar-${{ github.ref_name }}.apk"

      - name: Extract CHANGELOG section for tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            /^## / {
              in_section = ($2 == tag)
              next
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG section for $TAG — add a top-level ## $TAG entry before tagging"
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md
          echo "-------------------------"

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: bike-radar-${{ github.ref_name }}.apk
          body_path: release-notes.md
          # Appends "Full Changelog" compare link below body_path.
          generate_release_notes: true
          # Stable from 1.0.0 on. If a future tag is a pre-release
          # (e.g. a -rc / -beta suffix), set this true for that cut or
          # switch to dash-based detection on the tag name.
          prerelease: false

      - name: Wipe keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
